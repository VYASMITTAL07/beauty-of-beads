<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- The API worker serves both the data and every uploaded image, on a
         different origin to this page. Opening that connection while the
         bundle is still downloading removes the DNS + TLS handshake from the
         critical path of the first request that needs it. -->
    <link rel="preconnect" href="https://api.beautyofbeadsbykhushi.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Kaushan+Script&text=BeautyofdsO%20&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Kaushan+Script&text=BeautyofdsO%20&display=swap"
      />
    </noscript>
    <link rel="dns-prefetch" href="https://api.beautyofbeadsbykhushi.com" />
    <style>
      /* Inline so it costs no request and applies before anything downloads. */
      html,
      body {
        margin: 0;
        background: #ffeaea;
      }
      .boot {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: Georgia, "Times New Roman", serif;
        font-style: italic;
        font-size: 26px;
        letter-spacing: 0.02em;
        color: #3e2b23;
        opacity: 0.55;
      }
    </style>
    <title>Beauty of Beads by Khushi — Handmade Hair Accessories & Jewellery</title>
    <meta
      name="description"
      content="Handmade hair accessories and beaded jewellery, made to order in Nagpur. Hair pins, kaliras, parandis, ear cuffs and more."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- The shop is shared on Instagram and WhatsApp far more than it is found
         through search, and without these a shared link showed a bare URL with
         no picture and no words. -->
    <link rel="canonical" href="https://beautyofbeadsbykhushi.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Beauty of Beads by Khushi" />
    <meta property="og:title" content="Beauty of Beads by Khushi — Handmade Hair Accessories &amp; Jewellery" />
    <meta
      property="og:description"
      content="Handmade hair accessories and beaded jewellery, made to order in Nagpur."
    />
    <meta property="og:url" content="https://beautyofbeadsbykhushi.com/" />
    <meta property="og:image" content="https://beautyofbeadsbykhushi.com/share-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <span>Beauty of Beads</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
