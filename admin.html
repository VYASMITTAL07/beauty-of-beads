<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- The API worker serves both the data and every uploaded image, on a
         different origin to this page. Opening that connection while the
         bundle is still downloading removes the DNS + TLS handshake from the
         critical path of the first request that needs it. -->
    <link rel="preconnect" href="https://beauty-of-beads-api.vyasmittal1206.workers.dev" crossorigin />
    <link rel="dns-prefetch" href="https://beauty-of-beads-api.vyasmittal1206.workers.dev" />
    <title>Admin — Beauty of Beads</title>
    <meta name="robots" content="noindex, nofollow" />
  </head>

    <div id="admin-root"></div>
    <script type="module" src="/src/admin/main.tsx"></script>
  </body>
</html>
